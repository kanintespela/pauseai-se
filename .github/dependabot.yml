# Dependabot öppnar en PR en gång i månaden när Astro, andra paket eller
# GitHub Actions har nya versioner. Granska och slå ihop den om kontrollen är grön.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    ignore:
      # @astrojs/check stöder bara TypeScript 5 och 6. Ta bort raden när det
      # stöder TypeScript 7, annars går sajten inte att bygga.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      alla:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      alla:
        patterns: ['*']
