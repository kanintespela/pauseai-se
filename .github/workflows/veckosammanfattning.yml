name: Veckosammanfattning

# Varje måndag: skapar ett ärende med veckans ändringar på sajten och kommande
# evenemang, och stänger det direkt. Alla som bevakar repot (Watch → All Activity)
# får sammanfattningen som mejl.
on:
  schedule:
    - cron: '7 6 * * 1' # måndagar
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sammanfatta:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/veckosammanfattning.mjs
      - name: Skapa och stäng ärendet
        run: |
          gh label create veckosammanfattning --color 1D76DB --description "Veckans sammanfattning" --force
          url=$(gh issue create --title "Veckosammanfattning $(date +%Y), vecka $(date +%V)" --label veckosammanfattning --body-file veckan.md)
          gh issue close "$url"
