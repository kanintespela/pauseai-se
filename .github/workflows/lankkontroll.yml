name: Länkkontroll

# En gång i månaden: kontrollerar att alla externa länkar på sajten fungerar,
# och öppnar ett ärende med de länkar som har slutat fungera.
on:
  schedule:
    - cron: '53 6 1 * *' # den 1:a varje månad
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  lankar:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Kontrollerar den publicerade sajten, så att även interna länkar som
      # /donera följs på samma sätt som för en besökare.
      - name: Lista sajtens sidor
        run: node scripts/sidor.mjs > sidor.txt
      - name: Kontrollera länkar
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # 401, 403, 429 och 999 betyder oftast att sajten stoppar robotar, inte
          # att länken är död. Arkivkopior och typsnittsservrar hoppas över.
          args: >-
            --no-progress
            --scheme https --scheme http
            --accept 200..=299,401,403,429,999
            --max-retries 2
            --exclude '^https://fonts\.(googleapis|gstatic)\.com'
            --exclude '^https?://web\.archive\.org/'
            --files-from sidor.txt
          output: lankar.md
          fail: false
      - name: Öppna eller uppdatera ärendet
        if: steps.lychee.outputs.exit_code != 0
        run: |
          gh label create lankar --color D93F0B --description "Länkar som har slutat fungera" --force
          nummer=$(gh issue list --state open --label lankar --json number --jq '.[0].number')
          if [ -n "$nummer" ]; then
            gh issue edit "$nummer" --body-file lankar.md
          else
            gh issue create --title "Länkar som har slutat fungera" --label lankar --body-file lankar.md
          fi
