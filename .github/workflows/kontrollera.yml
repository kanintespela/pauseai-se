name: Kontrollera ändringen

# Kontrollerar att sajten går att bygga innan en PR slås ihop.
on:
  pull_request:

permissions:
  contents: read

jobs:
  bygg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Leta efter fel
        run: npm run check
      - name: Bygg sajten
        run: npm run build
