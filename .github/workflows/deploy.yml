name: Publicera på GitHub Pages

# Bygger och publicerar sajten vid varje ändring på main, även ändringar
# gjorda i Pages CMS, och dessutom varje natt så att evenemang som har
# passerat flyttas från Kommande till Tidigare.
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 1 * * *' # 01:17 UTC, alltså 02:17 eller 03:17 svensk tid
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicera
        id: deployment
        uses: actions/deploy-pages@v5
