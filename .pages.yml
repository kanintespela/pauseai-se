# Inställningar för Pages CMS (https://app.pagescms.org).
# Fälten måste matcha src/content.config.ts.

media:
  input: public/bilder
  output: /bilder
  rename: safe
  categories: [image]

content:
  - name: nyheter
    label: Nyheter
    type: collection
    path: src/content/nyheter
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [title, date]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Rubrik
        type: string
        required: true
      - name: date
        label: Datum
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: description
        label: Kort sammanfattning
        description: Visas i nyhetslistan och när länken delas.
        type: text
      - name: image
        label: Bild
        type: image
      - name: body
        label: Text
        type: rich-text
        options:
          format: markdown

  - name: evenemang
    label: Evenemang
    type: collection
    path: src/content/evenemang
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [title, date, location]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Namn på evenemanget
        type: string
        required: true
      - name: date
        label: Datum och tid
        type: date
        required: true
        options:
          time: true
          format: yyyy-MM-dd'T'HH:mm
      - name: location
        label: Plats
        description: Till exempel "Stockholm, Sergels torg" eller "Online".
        type: string
        required: true
      - name: link
        label: Länk till anmälan eller mer info
        type: string
      - name: description
        label: Kort beskrivning
        description: Visas i listan över evenemang.
        type: text
      - name: body
        label: Mer information
        type: rich-text
        options:
          format: markdown

  - name: sidor
    label: Sidor
    type: collection
    path: src/content/sidor
    filename: "{primary}.md"
    view:
      fields: [title]
      primary: title
    fields:
      - name: title
        label: Rubrik
        type: string
        required: true
      - name: description
        label: Beskrivning
        description: Visas i sökmotorer och när länken delas.
        type: text
      - name: body
        label: Text
        type: rich-text
        options:
          format: markdown
