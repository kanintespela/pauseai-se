# Inställningar för Pages CMS (https://app.pagescms.org).
# Fälten måste matcha src/content.config.ts.

media:
  input: public/bilder
  output: /bilder
  rename: safe
  categories: [image]

content:
  - name: nyheter
    label: Nyheter
    type: collection
    path: src/content/nyheter
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [title, date]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Rubrik
        description: Kort och konkret, till exempel "Vi demonstrerade utanför riksdagen".
        type: string
        required: true
      - name: date
        label: Datum
        description: Dagen nyheten publiceras. Nyheter sorteras efter datum, nyast först.
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: description
        label: Kort sammanfattning
        description: Visas i nyhetslistan och när länken delas.
        type: text
      - name: image
        label: Bild
        description: Valfri. Använd bara bilder vi har rätt att använda, och fråga alltid personer som syns om lov. Helst under 1 MB.
        type: image
      - name: body
        label: Text
        description: Själva nyheten. Använd knapparna eller skriv / för rubriker, listor, länkar och bilder.
        type: rich-text
        options:
          format: markdown

  - name: evenemang
    label: Evenemang
    type: collection
    path: src/content/evenemang
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [title, date, location]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Namn på evenemanget
        description: Till exempel "Föreläsning om AI-risker i Lund".
        type: string
        required: true
      - name: date
        label: Datum och tid
        description: När evenemanget börjar, i svensk tid. Evenemanget visas under Kommande fram till dess.
        type: date
        required: true
        options:
          time: true
          format: yyyy-MM-dd'T'HH:mm
      - name: location
        label: Plats
        description: Till exempel "Stockholm, Sergels torg" eller "Online".
        type: string
        required: true
      - name: link
        label: Länk till anmälan eller mer info
        description: Hela adressen, med https:// i början. Lämna tomt om det inte finns någon.
        type: string
      - name: description
        label: Kort beskrivning
        description: Visas i listan över evenemang.
        type: text
      - name: body
        label: Mer information
        description: Vad som händer, vem det passar och om man behöver anmäla sig.
        type: rich-text
        options:
          format: markdown

  - name: sidor
    label: Sidor
    type: collection
    path: src/content/sidor
    filename: "{primary}.md"
    view:
      fields: [title]
      primary: title
    fields:
      - name: title
        label: Rubrik
        description: Visas överst på sidan och i webbläsarens flik.
        type: string
        required: true
      - name: description
        label: Beskrivning
        description: Visas i sökmotorer och när länken delas.
        type: text
      - name: knapp_text
        label: Knapp, text
        description: Valfri. En stor knapp under rubriken, till exempel "Donera via PauseAI Global". Kräver också en länk.
        type: string
      - name: knapp_lank
        label: Knapp, länk
        description: Vart knappen leder. En adress på sajten (till exempel /engagera-dig) eller en hel adress med https://.
        type: string
      - name: body
        label: Text
        description: Sidans innehåll. Använd knapparna eller skriv / för rubriker, listor, länkar och bilder.
        type: rich-text
        options:
          format: markdown
